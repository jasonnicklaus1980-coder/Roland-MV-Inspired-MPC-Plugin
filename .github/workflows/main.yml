name: Build Roland MV MPC Plugin

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3 python3-pip zip binutils

      - name: Check repository files
        run: |
          echo "Checking project structure"
          ls -la
          test -f Makefile
          test -d src

      - name: Run project validation
        run: make validate

      - name: Build plugin
        run: make

      - name: Show build outputs
        if: always()
        run: |
          find . -maxdepth 4 -type f \
            \( -name '*.so' -o -name '*.zip' \) \
            -print

      - name: Save build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roland-mv-plugin-build
          path: |
            *.so
            payload/vst/*.so
            build/**/*.so
            *.zip
            build/**/*.zip
          if-no-files-found: warn
